<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css  " />
  </head>
  <body>
    <div class="container">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div class="calculator">
        <div class="input">
          <p>1250/5+9</p>
          <p>259</p>
        </div>
        <div class="number">
          <div>
            <button>C</button>
            <button>+=</button>
            <button>%</button>
            <button>+</button>
          </div>
          <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
          </div>
          <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>X</button>
          </div>
          <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
          </div>
          <section>
            <button style="grid-area: a;">0</button>  
            <button style="grid-area: b;">.</button>
            <button style="grid-area: c;">=</button>
          </section>
        </div>
      </div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
</html>
